<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siden finnes ikke – Fieldstone AS</title>
  <meta name="description" content="Siden du leter etter finnes ikke. Gå til forsiden til Fieldstone AS.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C1C1E'/%3E%3Cpath d='M6 19c-1.500-5 2-11.500 9-12.500 6.500-.9 11.500 3 12 8.500.5 6-4 10.500-11 10.500-5 0-8.700-2.200-10-6.500z' fill='%23F2F2F7'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --muted: #5F5F66;
      --line: #E5E5EA;
      --accent: #C2410C;
      --accent-text: #9B340A;
      --on-accent: #FFFFFF;
      --bar: rgba(242, 242, 247, 0.72);
      --glow-1: rgba(247, 168, 56, 0.22);
      --glow-2: rgba(194, 65, 12, 0.12);
      --glow-3: rgba(47, 168, 90, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1C1C1E;
        --text: #F2F2F7;
        --muted: #AEAEB2;
        --line: #38383A;
        --accent-text: #FF9A62;
        --bar: rgba(0, 0, 0, 0.66);
        --glow-1: rgba(247, 168, 56, 0.16);
        --glow-2: rgba(194, 65, 12, 0.22);
        --glow-3: rgba(47, 168, 90, 0.12);
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a:focus-visible {
      outline: 3px solid var(--accent-text);
      outline-offset: 3px;
      border-radius: 8px;
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    .bar {
      background: var(--bar);
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 1;
    }

    .bar .wrap {
      display: flex;
      align-items: center;
      height: 56px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .brand svg { width: 26px; height: 26px; }

    main {
      position: relative;
      flex: 1;
      display: grid;
      place-items: center;
      padding: 72px 0;
      text-align: center;
    }

    main::before {
      content: "";
      position: absolute;
      inset: -57px 0 0;
      z-index: -1;
      background:
        radial-gradient(520px 340px at 32% 30%, var(--glow-1), transparent 70%),
        radial-gradient(560px 360px at 68% 22%, var(--glow-2), transparent 70%),
        radial-gradient(620px 320px at 50% 78%, var(--glow-3), transparent 70%);
    }

    .code {
      margin: 0 0 8px;
      font-size: clamp(88px, 22vw, 168px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--accent-text);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    p.lead {
      margin: 0 0 32px;
      font-size: 19px;
      color: var(--muted);
    }

    .button {
      display: inline-flex;
      padding: 14px 26px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(194, 65, 12, 0.28);
      transition: transform 0.2s ease;
    }

    .button:hover { transform: translateY(-2px); }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 0 40px;
      font-size: 14px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
      .button:hover { transform: none; }
    }

    @media (max-width: 560px) {
      .wrap { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div class="wrap">
      <a class="brand" href="/" aria-label="Fieldstone AS, forsiden">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M6 19c-1.500-5 2-11.500 9-12.500 6.500-.9 11.500 3 12 8.500.5 6-4 10.500-11 10.500-5 0-8.700-2.200-10-6.500z"/></svg>
        Fieldstone
      </a>
    </div>
  </div>

  <main>
    <div class="wrap">
      <p class="code" aria-hidden="true">404</p>
      <h1>Siden finnes ikke</h1>
      <p class="lead">Vi fant ikke siden du leter etter.</p>
      <a class="button" href="/">Til forsiden</a>
    </div>
  </main>

  <footer>
    <div class="wrap">Fieldstone AS · Org.nr. 928 981 975</div>
  </footer>
</body>
</html>
