<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siden finnes ikke – Fieldstone AS</title>
  <meta name="description" content="Siden du leter etter finnes ikke. Gå til forsiden til Fieldstone AS.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --muted: #636366;
      --link: #0066CC;
      --button-bg: #1C1C1E;
      --button-text: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1C1C1E;
        --text: #F2F2F7;
        --muted: #AEAEB2;
        --link: #5EB0FF;
        --button-bg: #F2F2F7;
        --button-text: #1C1C1E;
      }
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 64px 20px 40px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .button {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--button-text);
      font-weight: 600;
      text-decoration: none;
    }

    .button:focus-visible {
      outline: 3px solid var(--link);
      outline-offset: 3px;
    }

    footer {
      padding: 24px 4px 0;
      font-size: 14px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .page { padding: 40px 16px 32px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card">
      <h1>Siden finnes ikke</h1>
      <p>Vi fant ikke siden du leter etter.</p>
      <a class="button" href="/">Til forsiden</a>
    </main>

    <footer>
      Fieldstone AS · Org.nr. 928 981 975
    </footer>
  </div>
</body>
</html>
